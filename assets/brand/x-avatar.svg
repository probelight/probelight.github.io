<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="beam" x1="0.95" y1="0.05" x2="0.35" y2="0.85">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="0.55" stop-color="#fbbf24" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>

  <!-- full-bleed background: survives any circular crop -->
  <rect width="512" height="512" fill="#151d28"/>

  <g clip-path="url(#circle)">
    <!-- narrow directed beam: enters top-right corner, converges on the lit token -->
    <polygon points="398,0 512,52 512,150 300,262" fill="url(#beam)"/>
  </g>

  <!-- token rows, inset well inside the circle -->
  <rect x="146" y="170" width="92" height="46" rx="23" fill="#5f7189"/>
  <rect x="254" y="170" width="116" height="46" rx="23" fill="#5f7189"/>

  <rect x="146" y="236" width="68" height="46" rx="23" fill="#5f7189"/>
  <rect x="220" y="226" width="150" height="66" rx="33" fill="#2dd4bf" opacity="0.3"/>
  <rect x="230" y="236" width="130" height="46" rx="23" fill="#2dd4bf"/>

  <rect x="146" y="302" width="124" height="46" rx="23" fill="#5f7189"/>
  <rect x="286" y="302" width="84" height="46" rx="23" fill="#5f7189"/>

  <!-- inner rim for definition on light backgrounds -->
  <circle cx="256" cy="256" r="252" fill="none" stroke="#41556c" stroke-width="6" opacity="0.6"/>
</svg>
