<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131b"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.9" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <polygon points="880,0 1200,0 1200,250 700,400" fill="url(#beam)"/>

  <!-- logo + wordmark -->
  <g transform="translate(72,56)">
    <g transform="scale(1.5)">
      <rect x="0.5" y="0.5" width="31" height="31" rx="6.75" fill="#1b2531" stroke="#54687f" stroke-width="1.2"/>
      <polygon points="21,0 30,0 30,9 14.5,16.2" fill="#fbbf24" opacity="0.45"/>
      <rect x="6" y="7.5" width="6" height="3.4" rx="1.7" fill="#57697f"/>
      <rect x="14.5" y="7.5" width="8" height="3.4" rx="1.7" fill="#57697f"/>
      <rect x="6" y="14.3" width="4.5" height="3.4" rx="1.7" fill="#57697f"/>
      <rect x="13.5" y="14.3" width="8" height="3.4" rx="1.7" fill="#2dd4bf"/>
      <rect x="6" y="21.1" width="9" height="3.4" rx="1.7" fill="#57697f"/>
      <rect x="17.5" y="21.1" width="6.5" height="3.4" rx="1.7" fill="#57697f"/>
    </g>
    <text x="66" y="34" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial"
          font-size="36" font-weight="750" letter-spacing="-1" fill="#e8edf4">Probe<tspan fill="#fbbf24">Light</tspan></text>
  </g>

  <!-- headline -->
  <text x="72" y="230" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial"
        font-size="62" font-weight="750" letter-spacing="-2.4" fill="#e8edf4">Watch a language model <tspan fill="#fbbf24">lie</tspan>,</text>
  <text x="72" y="302" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial"
        font-size="62" font-weight="750" letter-spacing="-2.4" fill="#e8edf4">token by token.</text>

  <text x="72" y="352" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial"
        font-size="25" fill="#98a6b8">Two linear probes read an LLM's activations live — on a MacBook.</text>

  <!-- token strip -->
  <g transform="translate(72,404)">
    <rect x="0" y="0" width="78" height="26" rx="13" fill="#2b3746"/>
    <rect x="90" y="0" width="118" height="26" rx="13" fill="#2b3746"/>
    <rect x="222" y="0" width="66" height="26" rx="13" fill="#2b3746"/>
    <ellipse cx="360" cy="13" rx="120" ry="52" fill="url(#glow)"/>
    <rect x="302" y="0" width="126" height="26" rx="13" fill="#2dd4bf"/>
    <rect x="442" y="0" width="84" height="26" rx="13" fill="#2b3746"/>
    <rect x="442" y="34" width="84" height="6" rx="3" fill="#a78bfa"/>
    <rect x="540" y="0" width="102" height="26" rx="13" fill="#2b3746"/>
    <rect x="540" y="34" width="102" height="6" rx="3" fill="#a78bfa" opacity="0.7"/>
    <rect x="656" y="0" width="70" height="26" rx="13" fill="#2b3746"/>
  </g>

  <!-- numbers strip -->
  <g font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial">
    <text x="72" y="536" font-size="34" font-weight="750" fill="#2dd4bf">1.00</text>
    <text x="72" y="566" font-size="17" fill="#5d6b7d">AUROC, lies vs honest</text>

    <text x="352" y="536" font-size="34" font-weight="750" fill="#2dd4bf">100%</text>
    <text x="352" y="566" font-size="17" fill="#5d6b7d">recall @ 1% false alarms</text>

    <text x="672" y="536" font-size="34" font-weight="750" fill="#fb923c">50%</text>
    <text x="672" y="566" font-size="17" fill="#5d6b7d">false alarms on honest</text>
    <text x="672" y="590" font-size="17" fill="#5d6b7d">talk about deception</text>
  </g>

  <text x="1128" y="566" text-anchor="end" font-family="-apple-system, 'SF Pro Text', Arial"
        font-size="19" fill="#5d6b7d">probelight.ai · Apache-2.0</text>
</svg>
