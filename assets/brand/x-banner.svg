<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d131b"/>
      <stop offset="1" stop-color="#0a0e13"/>
    </linearGradient>
    <linearGradient id="beam" x1="0.9" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="0.6" stop-color="#fbbf24" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1500" height="500" fill="url(#bg)"/>
  <polygon points="1180,0 1500,0 1500,210 900,330" fill="url(#beam)"/>

  <!-- token stream, shifted clear of X's bottom-left avatar overlap zone -->
  <g>
    <rect x="330" y="160" width="92" height="30" rx="15" fill="#2b3746"/>
    <rect x="438" y="160" width="140" height="30" rx="15" fill="#2b3746"/>
    <rect x="594" y="160" width="76" height="30" rx="15" fill="#2b3746"/>
    <rect x="686" y="160" width="118" height="30" rx="15" fill="#2b3746"/>
    <rect x="820" y="160" width="88" height="30" rx="15" fill="#2b3746"/>

    <rect x="330" y="210" width="118" height="30" rx="15" fill="#2b3746"/>
    <rect x="464" y="210" width="70" height="30" rx="15" fill="#2b3746"/>
    <ellipse cx="625" cy="225" rx="140" ry="66" fill="url(#glow)"/>
    <rect x="550" y="210" width="150" height="30" rx="15" fill="#2dd4bf"/>
    <rect x="716" y="210" width="96" height="30" rx="15" fill="#2b3746"/>
    <rect x="828" y="210" width="80" height="30" rx="15" fill="#2b3746"/>

    <rect x="330" y="260" width="80" height="30" rx="15" fill="#2b3746"/>
    <rect x="426" y="260" width="126" height="30" rx="15" fill="#2b3746"/>
    <rect x="568" y="260" width="92" height="30" rx="15" fill="#2b3746"/>
    <rect x="568" y="298" width="92" height="7" rx="3.5" fill="#a78bfa"/>
    <rect x="676" y="260" width="110" height="30" rx="15" fill="#2b3746"/>
    <rect x="676" y="298" width="110" height="7" rx="3.5" fill="#a78bfa" opacity="0.75"/>
    <rect x="802" y="260" width="72" height="30" rx="15" fill="#2b3746"/>
  </g>

  <!-- wordmark block, right side -->
  <text x="1400" y="228" text-anchor="end" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial"
        font-size="76" font-weight="750" letter-spacing="-2" fill="#e8edf4">Probe<tspan fill="#fbbf24">Light</tspan></text>
  <text x="1400" y="278" text-anchor="end" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial"
        font-size="27" fill="#98a6b8">a light inside the black box</text>
  <text x="1400" y="330" text-anchor="end" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial"
        font-size="22" fill="#5d6b7d">per-token honesty monitoring for open-weight LLMs</text>
</svg>
